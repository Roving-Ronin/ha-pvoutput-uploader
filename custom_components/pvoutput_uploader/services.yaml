reupload:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pvoutput_uploader
    since_failure:
      default: false
      selector:
        boolean:
    without_battery:
      default: false
      selector:
        boolean:
    passive_fields:
      selector:
        select:
          multiple: true
          options:
            - v1
            - v2
            - v3
            - v4
            - v5
            - v6
            - v7
            - v8
            - v9
            - v10
            - v11
            - v12
            - b1
            - b2
            - b3
            - b4
            - b5
            - b6
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    method:
      default: auto
      selector:
        select:
          translation_key: reupload_method
          options:
            - auto
            - statuses
            - outputs

import_from_recorder:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pvoutput_uploader
    start:
      required: true
      selector:
        datetime:
    end:
      selector:
        datetime:
    overwrite:
      default: false
      selector:
        boolean:
    upload:
      default: false
      selector:
        boolean:
    passive_fields:
      selector:
        select:
          multiple: true
          options:
            - v1
            - v2
            - v3
            - v4
            - v5
            - v6
            - v7
            - v8
            - v9
            - v10
            - v11
            - v12
            - b1
            - b2
            - b3
            - b4
            - b5
            - b6

export_config:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pvoutput_uploader
